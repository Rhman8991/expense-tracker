<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <main class="app">
            <header class="app-header">
                <h1>Expense Tracker</h1>
            </header>

            <section class="summary" aria-labelledby="summary-title">
                <h2 id="summary-title">Summary</h2>

                <div class="summary-grid">
                    <article class="summary-card">
                        <h3>Balance</h3>
                        <p id="balance">$0.00</p>
                    </article>

                    <article class="summary-card">
                        <h3>Income</h3>
                        <p id="income">$0.00</p>
                    </article>

                    <article class="summary-card">
                        <h3>Expenses</h3>
                        <p id="expenses">$0.00</p>
                    </article>
                </div>
            </section>

            <section id="transaction-form-section" aria-labelledby="form-title">
                <h2 id="form-title">Add Transaction</h2>

                <form id="transaction-form">
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select name="type" id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input name="amount" id="amount" type="number" min="0" step="0.01" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <input name="category" id="category" type="text" placeholder="e.g Food">
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input name="date" id="date" type="date">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea name="description" id="description" rows="3" placeholder="Optional description"></textarea>
                    </div>

                    <button type="submit">Add transaction</button>
                </form>
            </section>

            <section class="transactions-section" aria-labelledby="transaction-title">
                <h2 id="transaction-title">Transactions</h2>

                <div id="transactions-list">

                    <p>No transactions yet.</p>
                </div>
            </section>
        </main>
        <script src="js/script.js"></script>
    </body>
</html>
